# AEGIS MESH: server + a small test network that imitates the jury's lab.
#   docker compose up -d --build
#   docker compose exec aegis aegis targets add 172.30.0.0/27
#   docker compose exec aegis aegis scan start --wait
#   docker compose exec aegis aegis hosts
# Panel: http://127.0.0.1:8000 (admin password: docker compose exec aegis cat /data/admin-password.txt)
# API and its documentation: http://127.0.0.1:8000/docs
#
# Optional profiles:
#   --profile dojo     own DefectDojo for findings export (http://127.0.0.1:8081, admin / see DOJO_ADMIN_PASSWORD)
#   --profile zmiana   one more lab host (.28), to show "new host" between two scans

name: aegis-mesh

services:
  aegis:
    build: ./server
    image: aegis-mesh/server:dev
    restart: unless-stopped
    ports:
      - "${AEGIS_BIND:-127.0.0.1}:8000:8000"   # panel + API; AEGIS_BIND=0.0.0.0 opens it to the network
    volumes:
      - aegis-data:/data                # database
      - aegis-keys:/keys                # encryption key, kept apart from the database
    environment:
      AEGIS_TZ: Europe/Warsaw
      # First start: admin password from here, or a random one saved in /data/admin-password.txt
      AEGIS_ADMIN_PASSWORD: ${AEGIS_ADMIN_PASSWORD:-}
      # Used only until DefectDojo is set in the settings; harmless when the dojo profile is off.
      AEGIS_DOJO_URL: http://dojo-uwsgi:8081    # DefectDojo API inside compose (its UI is dojo-nginx)
      AEGIS_DOJO_USER: admin
      AEGIS_DOJO_PASSWORD: ${DOJO_ADMIN_PASSWORD:-aegis-lab-dojo}
    cap_add: [NET_RAW, NET_ADMIN]       # nmap host discovery and SYN scan
    networks:
      lab:
        ipv4_address: 172.30.0.10
      dojo: {}

  # ---- test network (lab) -------------------------------------------------------
  web-nginx:
    image: nginx:1.27-alpine
    networks: { lab: { ipv4_address: 172.30.0.20 } }
  web-apache:
    image: httpd:2.4-alpine
    networks: { lab: { ipv4_address: 172.30.0.21 } }
  staging:
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8080", "--directory", "/srv"]
    volumes: ["./lab/staging:/srv:ro"]
    networks: { lab: { ipv4_address: 172.30.0.22 } }
  cache:
    image: redis:7.4-alpine
    networks: { lab: { ipv4_address: 172.30.0.30 } }
  wordpress:                            # a WordPress-like page: CMS, version in generator and footer
    image: nginx:1.27-alpine
    volumes: ["./lab/wordpress:/usr/share/nginx/html:ro"]
    networks: { lab: { ipv4_address: 172.30.0.23 } }
  lab-cert:                             # one-shot: self-signed certificate for the camera
    build: ./server                     # same image as aegis (cached), never pulled
    image: aegis-mesh/server:dev
    entrypoint: ["python", "/lab/make_cert.py", "/certs"]
    volumes: ["./lab/kamera:/lab:ro", "lab-certs:/certs"]
    network_mode: none
    restart: "no"
  kamera:                               # an "IoT camera" on HTTPS with a self-signed certificate
    image: nginx:1.27-alpine
    depends_on: { lab-cert: { condition: service_completed_successfully } }
    volumes:
      - "./lab/kamera/index.html:/usr/share/nginx/html/index.html:ro"
      - "./lab/kamera/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "lab-certs:/certs:ro"
    networks: { lab: { ipv4_address: 172.30.0.24 } }
  nowy-serwer:                          # appears only with --profile zmiana
    image: httpd:2.4-alpine
    profiles: [zmiana]
    networks: { lab: { ipv4_address: 172.30.0.28 } }

  # ---- DefectDojo (optional: --profile dojo) ---------------------------------------
  # Images from Docker Hub, pinned. Local test instance only: published on localhost.
  dojo-nginx:
    image: defectdojo/defectdojo-nginx:3.5.103
    profiles: [dojo]
    depends_on: { dojo-uwsgi: { condition: service_started } }
    environment:
      DD_UWSGI_HOST: dojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes: ["dojo-media:/usr/share/nginx/html/media"]
    ports: ["127.0.0.1:8081:8080"]
    networks: [dojo]
  dojo-uwsgi:
    image: defectdojo/defectdojo-django:3.5.103
    profiles: [dojo]
    depends_on:
      dojo-initializer: { condition: service_completed_successfully }
      dojo-postgres: { condition: service_started }
      dojo-valkey: { condition: service_started }
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "30", "--", "/entrypoint-uwsgi.sh"]
    environment: &dojo-env
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@dojo-postgres:5432/defectdojo
      DD_DATABASE_HOST: dojo-postgres
      DD_CELERY_BROKER_URL: redis://dojo-valkey:6379/0
      DD_CACHE_URL: redis://dojo-valkey:6379/1
      DD_SECRET_KEY: ${DOJO_SECRET_KEY:-aegis-lab-only-change-me-0123456789abcdef}
      DD_CREDENTIAL_AES_256_KEY: ${DOJO_AES_KEY:-aegis-lab-only-32-characters-key}
      DD_DATABASE_READINESS_TIMEOUT: "60"
    volumes: ["dojo-media:/app/media"]
    networks: [dojo]
  dojo-celeryworker:
    image: defectdojo/defectdojo-django:3.5.103
    profiles: [dojo]
    depends_on:
      dojo-initializer: { condition: service_completed_successfully }
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "30", "--", "/entrypoint-celery-worker.sh"]
    environment: *dojo-env
    volumes: ["dojo-media:/app/media"]
    networks: [dojo]
  dojo-initializer:
    image: defectdojo/defectdojo-django:3.5.103
    profiles: [dojo]
    depends_on: { dojo-postgres: { condition: service_started } }
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *dojo-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@aegis.lab
      DD_ADMIN_PASSWORD: ${DOJO_ADMIN_PASSWORD:-aegis-lab-dojo}
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: AEGIS
      DD_INITIALIZE: "true"
    networks: [dojo]
  dojo-postgres:
    image: postgres:18-alpine
    profiles: [dojo]
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes: ["dojo-postgres:/var/lib/postgresql"]
    networks: [dojo]
  dojo-valkey:
    image: valkey/valkey:9.1-alpine
    profiles: [dojo]
    networks: [dojo]

volumes:
  aegis-data:
  aegis-keys:
  lab-certs:
  dojo-media:
  dojo-postgres:

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  dojo: {}
