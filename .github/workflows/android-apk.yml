name: Android APK

on:
  push:
    paths: ["android-app/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        # The laptop's Tailscale Funnel address goes into the app (repository variable AEGIS_FUNNEL_URL, may be empty).
        env:
          AEGIS_FUNNEL_URL: ${{ vars.AEGIS_FUNNEL_URL }}
        run: ./gradlew --no-daemon assembleDebug -PaegisUrl="$AEGIS_FUNNEL_URL" && cp app/build/outputs/apk/debug/app-debug.apk aegis-mesh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-mesh-apk
          path: android-app/aegis-mesh.apk
      - name: Publish to the "apk-latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automatyczna kompilacja z commita ${GITHUB_SHA::7}. Pobierz aegis-mesh.apk na telefonie i zainstaluj."
          git tag -f apk-latest && git push -f origin apk-latest
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "AEGIS Mesh APK (najnowszy)" --notes "$notes" --prerelease
            gh release upload apk-latest aegis-mesh.apk --clobber
          else
            gh release create apk-latest aegis-mesh.apk --title "AEGIS Mesh APK (najnowszy)" --notes "$notes" --prerelease
          fi
