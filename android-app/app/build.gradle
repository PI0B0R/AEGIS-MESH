plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'pl.aegismesh.sensor'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.aegismesh.sensor'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.5'
        // The laptop's Tailscale Funnel address, e.g. https://aegis.example-tailnet.ts.net
        // (gradle -PaegisUrl=... or the AEGIS_FUNNEL_URL repository variable in CI). Empty: the app asks or searches the LAN.
        buildConfigField 'String', 'AEGIS_URL', '"' + (project.findProperty('aegisUrl') ?: '').toString().replace('"', '') + '"'
    }
    buildFeatures { buildConfig true }
    // Shared DEBUG key (public, not a secret) so every CI build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('aegis-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
