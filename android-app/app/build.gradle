plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'pl.aegismesh.sensor'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.aegismesh.sensor'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }
    // Shared DEBUG key (public, not a secret) so every CI build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('aegis-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    // Google code scanner: QR without camera permission (needs Google Play services).
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    testImplementation 'junit:junit:4.13.2'
}
