plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'pl.aegismesh.sensor'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.aegismesh.sensor'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.5'
        // The laptop's Tailscale Funnel address. Another one: gradle -PaegisUrl=... or the AEGIS_FUNNEL_URL
        // repository variable in CI. When it does not answer, the app searches the Wi-Fi network.
        def funnel = (project.findProperty('aegisUrl') ?: '').toString().trim()
        buildConfigField 'String', 'AEGIS_URL', '"' + (funnel ?: 'https://aegis.tail36df25.ts.net').replace('"', '') + '"'
    }
    buildFeatures { buildConfig true }
    // Shared DEBUG key (public, not a secret) so every CI build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('aegis-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
